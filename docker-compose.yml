services:
  db:
    image: postgres:16-alpine
    container_name: helpdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-helpdesk_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpdesk_secret}
      POSTGRES_DB: ${DB_NAME:-helpdesk_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-helpdesk_user} -d ${DB_NAME:-helpdesk_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-helpdesk_user}
      DB_PASSWORD: ${DB_PASSWORD:-helpdesk_secret}
      DB_NAME: ${DB_NAME:-helpdesk_db}
      DB_SSLMODE: disable
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
